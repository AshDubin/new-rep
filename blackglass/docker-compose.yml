version: '3.9'
services:
  backend:
    build: ./backend
    volumes:
      - ./backend/app:/app
    env_file:
      - .env
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/usr/src/app
    command: npm start
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  db:
    image: postgres:14
    environment:
      - POSTGRES_DB=blackglass
      - POSTGRES_USER=blackglass
      - POSTGRES_PASSWORD=blackglass
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:6
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

volumes:
  db-data:
  redis-data:
